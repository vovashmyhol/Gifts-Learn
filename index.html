<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gifts Learn</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="dark-theme">
    <header class="main-header">
        <div class="header-item streaks">
            <img src="Fire.webp" alt="Fire" class="header-icon">
            <span class="count">0</span>
        </div>
        <div class="header-item lives">
            <span class="count">5</span>
            <img src="Heart.webp" alt="Heart" class="header-icon">
        </div>
    </header>

    <main class="content">
        <div class="banner-block" id="education-engine">
            <div class="banner-overlay">
                <h2>Движок Обучения</h2>
                <p>Учи названия подарков и их историю</p>
            </div>
            <!-- Сюда вставится фото баннера -->
            <div class="banner-placeholder"></div>
        </div>

        <div class="banner-block" id="memory-game">
            <div class="banner-overlay">
                <h2>Режим "Пары"</h2>
                <p>Тренируй память на время</p>
            </div>
            <!-- Сюда вставится фото баннера -->
            <div class="banner-placeholder"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
